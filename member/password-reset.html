<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>パスワード再設定 | ORIGAMI GRP Member</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="./styles/member-styles.css" />
</head>

<body class="member-page">

  <!-- Header -->
  <header class="header member-header">
    <div class="inner">
      <a class="brand" href="index.html">ORIGAMI GRP <span style="font-size: 12px; opacity: 0.7; font-weight: normal;">Member</span></a>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="member-auth-container">
        <h2>パスワード再設定</h2>
        <p class="text-center" style="margin-bottom: 32px; color: var(--text-muted); font-size: 14px;">
          ご登録済みのメールアドレスを入力してください。<br>再設定用のリンクをお送りします。
        </p>

        <form id="reset-form">
          <div class="form-group-member">
            <label style="display: block; font-weight: 700; margin-bottom: 8px; font-size: 14px;">メールアドレス</label>
            <input type="email" id="email" placeholder="example@origami.com" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 18px; font-size: 16px;">再設定メールを送信する</button>
          <div id="message-container" style="margin-top: 16px; text-align: center; font-size: 14px; display: none;"></div>
        </form>

        <div class="member-form-note">
          <p><a href="login.html">ログイン画面へ戻る</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer member-footer">
    <div class="footer-bottom" style="margin-top: 0; border-top: none;">
      <div>&copy; 2026 ORIGAMI GRP. Member System.</div>
    </div>
  </footer>

  <!-- Supabase v2 SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://gfvnnxuupdmbuxejyfck.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdmdm5ueHV1cGRtYnV4ZWp5ZmNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MzY3NjAsImV4cCI6MjA4OTExMjc2MH0.Eq0AVSyY9Jy3dxt-RxwQvJcrntX5y3L2dhhcIz9tWnk';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const msgBox = document.getElementById('message-container');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      msgBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = '送信中...';

      const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/member/password-update.html'
      });

      if (error) {
        msgBox.textContent = 'エラーが発生しました: ' + error.message;
        msgBox.style.color = '#dc3545';
      } else {
        msgBox.textContent = 'パスワード再設定用のメールを送信しました。メールボックスをご確認ください。';
        msgBox.style.color = '#28a745';
      }
      
      msgBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = '再設定メールを送信する';
    });
  </script>
</body>

</html>
