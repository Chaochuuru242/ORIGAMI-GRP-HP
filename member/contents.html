<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>コンテンツ一覧 | ORIGAMI GRP Member</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="./styles/member-styles.css" />
  <!-- アクセス制御（ログインガード） -->
  <style>body { display: none; }</style> <!-- 判定中のチラつき防止 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/auth-guard.js"></script>
</head>

<body class="member-page">

  <div class="member-layout">
    <!-- Sidebar -->
    <aside class="member-sidebar">
      <div class="member-sidebar-header" style="padding: 0 24px 32px;">
        <a href="index.html" style="font-size: 18px; font-weight: 800; color: var(--primary); text-decoration: none;">ORIGAMI GRP</a>
        <div class="hamburger-member" onclick="this.classList.toggle('active'); document.querySelector('.side-nav').classList.toggle('active');">
          <span></span><span></span><span></span>
        </div>
      </div>
      <nav class="side-nav">
        <ul>
          <li><a href="dashboard.html"><span>🏠</span> ダッシュボード</a></li>
          <li class="active"><a href="contents.html"><span>📚</span> コンテンツ一覧</a></li>
          <li><a href="account-billing.html"><span>💳</span> お支払い・プラン</a></li>
          <li><a href="support.html"><span>💬</span> サポート・FAQ</a></li>
          <li><a href="profile.html"><span>👤</span> プロフィール設定</a></li>

          <li class="adder-menu" style="display: none; margin-top: 24px; border-top: 1px solid #e2e8f0; padding-top: 16px;"><a href="upload.html"><span>🎥</span> 動画の登録</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="member-main-content">
      <header style="margin-bottom: 40px;">
        <h1 style="font-size: 24px; font-weight: 800;">コンテンツライブラリ</h1>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">実践で使えるAIノウハウを体系的に。最新動画は毎週更新。</p>
      </header>

      <!-- Filter Bar -->
      <div id="filter-bar" style="display: flex; gap: 12px; margin-bottom: 32px; overflow-x: auto; padding-bottom: 8px;">
        <button class="btn btn-primary filter-btn" data-keyword="" style="padding: 8px 16px; font-size: 13px;">すべて</button>
        <button class="btn btn-ghost filter-btn" data-keyword="AI" style="padding: 8px 16px; font-size: 13px; background: #fff;">AI・ChatGPT</button>
        <button class="btn btn-ghost filter-btn" data-keyword="効率化" style="padding: 8px 16px; font-size: 13px; background: #fff;">効率化ツール</button>
        <button class="btn btn-ghost filter-btn" data-keyword="活用" style="padding: 8px 16px; font-size: 13px; background: #fff;">活用・実務</button>
        <button class="btn btn-ghost filter-btn" data-keyword="マーケティング" style="padding: 8px 16px; font-size: 13px; background: #fff;">マーケティング</button>
        <button class="btn btn-ghost filter-btn" data-keyword="デザイン" style="padding: 8px 16px; font-size: 13px; background: #fff;">デザイン・画像</button>
      </div>

      <!-- Content Grid Container -->
      <div id="video-container">
        <p style="color: var(--text-muted); font-size: 14px; padding: 20px;">動画を読み込み中...</p>
      </div>
    </main>
  </div>

</body>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Supabaseの初期化（URLとKeyは既存と同じ）
      const supabaseUrl = 'https://gfvnnxuupdmbuxejyfck.supabase.co';
      const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdmdm5ueHV1cGRtYnV4ZWp5ZmNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MzY3NjAsImV4cCI6MjA4OTExMjc2MH0.Eq0AVSyY9Jy3dxt-RxwQvJcrntX5y3L2dhhcIz9tWnk';
      const client = window.supabase.createClient(supabaseUrl, supabaseKey);

      const container = document.getElementById('video-container');

      try {
        // 現在のユーザー情報を取得し、プロフィールからプランを特定する
        const { data: { session } } = await client.auth.getSession();
        let currentPlan = 'free'; // default
        let isPowerUser = false;

        if (session) {
          const { data: profile } = await client.from('profiles').select('plan, role').eq('id', session.user.id).single();
          if (profile) {
            currentPlan = (profile.plan || 'free').trim().toLowerCase();
            if (profile.role === 'admin' || profile.role === 'adder') {
              isPowerUser = true;
            }
          }
        }

        // 閲覧可能プランの階層設定（正規化後の小文字で判定）
        let allowedPlans = ['all'];
        if (currentPlan === 'light') allowedPlans = ['all', 'light'];
        if (currentPlan === 'standard') allowedPlans = ['all', 'light', 'standard'];
        if (currentPlan === 'premium') allowedPlans = ['all', 'light', 'standard', 'premium'];

        // DBから動画を取得（公開済み限定）
        let query = client.from('videos').select('*').eq('status', 'published').order('created_at', { ascending: false });
        
        // 全ユーザーに全動画を見せるため、target_planでの絞り込みを廃止
        const { data: fetchVideos, error } = await query;
        if (error) throw error;
        
        // 全動画データを保持
        let allVideos = fetchVideos || [];

        // 描画関数
        const renderVideos = (keywordStr = "") => {
          container.innerHTML = ''; // 一旦消去
          
          // タイトル部分一致で簡易フィルタ機能
          const filtered = allVideos.filter(v => {
            if (!keywordStr) return true;
            return v.title.includes(keywordStr);
          });

          if (filtered.length === 0) {
            container.innerHTML = '<p style="color: var(--text-muted); font-size: 14px; padding: 20px;">該当する動画が見つかりませんでした。</p>';
            return;
          }

          // プラン（コース）ごとのグループ化用
          const sections = [
            { id: 'basic', title: '【Basic】全プラン共通コンテンツ', plans: ['all', 'light'], videos: [] },
            { id: 'standard', title: '【Standard】スタンダードコース専用', plans: ['standard'], videos: [] },
            { id: 'premium', title: '【Premium】プレミアムコース専用', plans: ['premium'], videos: [] }
          ];

          filtered.forEach(v => {
            const targetPlan = (v.target_plan || 'all').trim().toLowerCase();
            const section = sections.find(s => s.plans.includes(targetPlan));
            if (section) section.videos.push(v);
          });

          // セクションごとに描画
          sections.forEach(sec => {
            if (sec.videos.length === 0) return;

            // セクション見出しの追加（親のグリッドがないため、各セクションが独立した行になります）
            const sectionHeader = `
              <div style="margin: 32px 0 20px; padding-bottom: 12px; border-bottom: 2px solid var(--primary-light); display: flex; align-items: center; gap: 12px; width: 100%;">
                <h2 style="font-size: 18px; font-weight: 800; color: var(--primary); margin:0;">${sec.title}</h2>
                <span style="font-size: 12px; background: var(--bg-sub); padding: 2px 8px; border-radius: 12px; color: var(--text-muted); font-weight:700;">${sec.videos.length}</span>
              </div>
              <div class="content-grid" id="grid-${sec.id}" style="margin-bottom: 48px;"></div>
            `;
            container.insertAdjacentHTML('beforeend', sectionHeader);
            const gridContainer = document.getElementById(`grid-${sec.id}`);

            sec.videos.forEach(v => {
              const dateStr = new Date(v.created_at).toLocaleDateString('ja-JP');
              const targetPlan = (v.target_plan || 'all').trim().toLowerCase();
              const isViewable = isPowerUser || allowedPlans.includes(targetPlan);
              
              let planLabel = '全プラン共通';
              if (targetPlan === 'standard') planLabel = 'スタンダード';
              if (targetPlan === 'premium') planLabel = 'プレミアム';
              
              let thumbUrl = v.thumbnail_url || '';
              let embedUrl = v.video_url || '';
              if (!thumbUrl && embedUrl.includes('youtube.com/watch?v=')) {
                try {
                  const vid = new URL(embedUrl).searchParams.get('v');
                  thumbUrl = `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;
                } catch(e) {}
              } else if (!thumbUrl && embedUrl.includes('youtu.be/')) {
                const vid = embedUrl.split('youtu.be/')[1].split('?')[0];
                thumbUrl = `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;
              }
              
              let thumbHtml = '';
              if (thumbUrl) {
                const imgStyle = isViewable ? 'transform 0.3s' : 'transform 0.3s, filter 0.3s';
                const imgFilter = isViewable ? '' : 'filter: blur(2px) grayscale(0.5);';
                thumbHtml = `<img src="${thumbUrl}" alt="thumbnail" style="width: 100%; height: 100%; object-fit: cover; transition: ${imgStyle}; ${imgFilter}" ${isViewable ? `onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'"` : ''}>`;
                if (!isViewable) {
                  thumbHtml += `
                    <div style="position:absolute; inset:0; background:rgba(100,116,139,0.4); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); pointer-events:none;"></div>
                    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); font-size:48px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); pointer-events:none;">🔒</div>
                  `;
                }
              } else {
                thumbHtml = `<span style="font-size: 32px;">▶️</span>`;
              }

              let actionHtml = '';
              if (isViewable) {
                 actionHtml = `
                   <span class="status-badge" style="background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; margin-bottom: 8px;">視聴可能</span>
                   <h4 style="margin-bottom:8px; font-size:15px; font-weight:700; color:#0f172a; line-height:1.4;">${v.title}</h4>
                   <p class="content-meta">${dateStr} | プラン: ${planLabel}</p>
                   <a href="content-detail.html?id=${v.id}" style="display: block; margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--primary);">詳細・視聴画面へ</a>
                 `;
              } else {
                 actionHtml = `
                   <span class="status-badge" style="background: #f8fafc; color: #64748b; border: 1px solid #e2e8f0; margin-bottom: 8px;">限定公開コンテンツ</span>
                   <h4 style="margin-bottom:8px; font-size:15px; font-weight:700; color:#0f172a; line-height:1.4;">🔒 ${v.title}</h4>
                   <p class="content-meta">${dateStr} | プラン: ${planLabel}</p>
                   <a href="account-billing.html" style="display: block; margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--primary); text-decoration: underline;">プランをアップグレードする</a>
                 `;
              }

              const cardHtml = `
                <div class="content-item" style="overflow:hidden; border: 1px solid var(--border); transition: transform 0.3s, box-shadow 0.3s;" onmouseover="this.style.boxShadow='var(--shadow-md)'; this.style.transform='translateY(-2px)'" onmouseout="this.style.boxShadow=''; this.style.transform=''">
                  <div class="content-thumb" style="display:flex; justify-content:center; align-items:center; background:#1e293b; color:#fff; padding:0; overflow:hidden; position:relative; aspect-ratio: 16/9;">
                    ${thumbHtml}
                  </div>
                  <div class="content-info">
                    ${actionHtml}
                  </div>
                </div>
              `;
              gridContainer.insertAdjacentHTML('beforeend', cardHtml);
            });
          });
        };

        // 初期描画
        renderVideos();

        // フィルターボタンのアクティブ制御とイベント登録
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
          btn.addEventListener('click', (e) => {
            // クラスの付け替え
            filterBtns.forEach(b => {
              b.classList.remove('btn-primary');
              b.classList.add('btn-ghost');
              b.style.background = '#fff';
            });
            e.target.classList.remove('btn-ghost');
            e.target.classList.add('btn-primary');
            e.target.style.background = ''; // ghostの背景指定を除去

            const kw = e.target.getAttribute('data-keyword');
            renderVideos(kw);
          });
        });

      } catch (err) {
        console.error("コンテンツの読み込みエラー:", err);
        container.innerHTML = '<p style="color: red; font-size: 14px; padding: 20px;">動画一覧の取得に失敗しました。</p>';
      }
    });
  </script>
</html>
